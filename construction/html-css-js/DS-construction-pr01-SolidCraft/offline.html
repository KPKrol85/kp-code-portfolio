<!doctype html>
<html lang="pl" class="no-js">
  <head>

    <!-- SEO -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"

      name="theme-color"
      content="#0b1220"
      media="(prefers-color-scheme: dark)"

    <!-- Styles -->
