<header class="site-header" aria-label="Nagłówek strony z nawigacją">
  <div class="container header__inner">
    <a class="brand" href="index.html#hero" aria-label="Atelier No.02 — Strona główna">

              </svg>

            <ul class="nav__dropdown" id="nav-dd-about" aria-labelledby="nav-dd-about-trigger">

            <button class="nav__dropdown-toggle" id="nav-dd-menu-trigger" type="button" aria-expanded="false" aria-controls="nav-dd-menu" aria-label="Pokaż więcej: Menu">

                <path d="M3.25 5.75L8 10.5l4.75-4.75" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

            <ul class="nav__dropdown" id="nav-dd-gallery" aria-labelledby="nav-dd-gallery-trigger">

          <li><a href="index.html#testimonials">Opinie</a></li>

        <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true"><img src="assets/icons/svg-icon/icon-moon.svg" alt="" width="24" height="24" /></span>
